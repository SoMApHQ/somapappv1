# SoMAp SMS Worker. NO SECRETS IN THIS FILE (the repo is public).
# Secrets are added with:  npx wrangler secret put <NAME>
#   SWALASMS_TEST_KEY         swl_test_...  (sandbox: nothing is really sent)
#   SWALASMS_LIVE_KEY         swl_live_...  (real sends; only the HQ pipe test uses it in Phase 2)
#   FIREBASE_SERVICE_ACCOUNT  the whole service-account JSON (read-only use)
#   HQ_EMAILS                 comma-separated HQ Google emails
#   HQ_TEST_NUMBERS           comma-separated phones allowed for the live pipe test
#   SWALASMS_WEBHOOK_SECRET   (later) delivery-report webhook secret
name = "somap-sms"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "somaptestt"
FIREBASE_DB_URL = "https://somaptestt-default-rtdb.firebaseio.com"
ALLOWED_ORIGINS = "https://somapv2i.com,https://www.somapv2i.com,http://localhost:*,http://127.0.0.1:*"
# Live sending unlocked 2026-11-26 (HQ still chooses the mode). Set to "false" to lock live again.
LIVE_ENABLED = "true"

# Daily cleanup of expired Matokeo report PDFs (01:00 UTC = 04:00 Dar es Salaam).
[triggers]
crons = ["0 1 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "somap-sms"
database_id = "c51e67d3-aee1-4ab1-93ca-59fb65db7205"
