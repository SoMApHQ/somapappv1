<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hesabu ya Mali | Inventory</title>
  <link rel="stylesheet" href="./css/inventory.css?v=20261025">
  <script src="../somapappv1multischool/js/context.js?v=20261007"></script>
  <script src="../Todashboardhtml/yearContext.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="../firebase.js"></script>
  <script src="../js/inventory/inventory_templates.js?v=20261025"></script>
  <script src="../js/inventory/inventory_core.js?v=20261025"></script>
  <script src="../js/inventory/inventory_ui.js?v=20261025"></script>
</head>
<body class="inv-page">
  <div class="inv-shell">
    <header class="inv-header">
      <div class="inv-header__top">
        <img class="inv-header__logo" src="../images/somap-logo.png.jpg" alt="SoMAp">
        <div>
          <h1>Hesabu ya Mali · Inventory</h1>
          <p class="inv-header__sub" id="invSchoolLine">Inapakia… · Loading…</p>
        </div>
        <div class="inv-header__actions">
          <a class="inv-link" id="invBackLink" href="workersdashboard.html">← Rudi · Back</a>
        </div>
      </div>
      <div class="inv-header__meta" id="invMeta"></div>
    </header>

    <div id="invBanners"></div>
    <div id="invStats" class="inv-stats"></div>

    <nav class="inv-tabs" id="invTabs" role="tablist">
      <button class="inv-tab is-active" data-tab="today">Leo · Today</button>
      <button class="inv-tab" data-tab="moves">Uhamisho · Movements</button>
      <button class="inv-tab" data-tab="history">Historia · History</button>
      <button class="inv-tab" data-tab="record">Rekodi yangu · My record</button>
    </nav>

    <section class="inv-panel" id="panel-today"><div class="inv-loading">Inapakia hesabu… · Loading inventory…</div></section>
    <section class="inv-panel" id="panel-moves" hidden></section>
    <section class="inv-panel" id="panel-history" hidden></section>
    <section class="inv-panel" id="panel-record" hidden></section>
  </div>

  <div class="inv-submitbar inv-hide" id="invSubmitBar">
    <div class="inv-submitbar__inner">
      <div class="inv-submitbar__status" id="invSaveStatus">Rasimu huhifadhiwa yenyewe · Drafts save automatically</div>
      <button class="inv-btn inv-btn--primary" id="invSubmitBtn">Wasilisha · Submit</button>
    </div>
  </div>

  <script src="../js/inventory/inventory_form.js?v=20261025"></script>
</body>
</html>
