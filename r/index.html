<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- This page can ONLY talk to the SoMAp SMS Worker (and load the PDF viewer): no Firebase, no other site. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; worker-src https://cdnjs.cloudflare.com blob:; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src https://somap-sms.somap.workers.dev https://cdnjs.cloudflare.com; base-uri 'none'; form-action 'none'">
  <title>Ripoti ya Matokeo</title>
  <style>
    :root { --bg:#e8ebf3; --bar:#ffffff; --ink:#172033; --muted:#5f6b85; --line:#d6dbe8; --accent:#3b3fd8; --accent2:#6c3fd8; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b1020; --bar:#131a2c; --ink:#e7ebf5; --muted:#9aa5bd; --line:#232c44; --accent:#7f86ff; --accent2:#a084ff; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .top { position: sticky; top: 0; z-index: 3; background: var(--bar); border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
    .top .title { flex: 1; min-width: 0; }
    .top .title b { display: block; font-size: 15px; }
    .top .title span { font-size: 12px; color: var(--muted); }
    .zoom { display: flex; align-items: center; gap: 4px; }
    .zoom button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bar); color: var(--ink); font: 700 20px/1 system-ui, sans-serif; cursor: pointer; }
    .zoom span { min-width: 46px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .viewer { overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 12px 10px 110px; }
    .pages { margin: 0 auto; width: 100%; max-width: 900px; transition: width .15s ease; }
    .page { margin: 0 auto 14px; }
    .page img { display: block; width: 100%; height: auto; background: #fff; border-radius: 4px; box-shadow: 0 4px 18px rgba(20, 30, 70, .16); }
    .page .label { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .page.pending { aspect-ratio: 210 / 297; background: #fff; border-radius: 4px; display: grid; place-items: center; color: var(--muted); box-shadow: 0 4px 18px rgba(20, 30, 70, .08); }
    .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; gap: 8px; justify-content: center; }
    .download { flex: 1 1 auto; max-width: 520px; border: 0; border-radius: 16px; padding: 16px 18px; font: 800 17px/1.1 system-ui, sans-serif; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 22px rgba(59, 63, 216, .35); display: inline-flex; gap: 10px; align-items: center; justify-content: center; }
    .download svg { width: 22px; height: 22px; }
    .share { flex: 0 0 auto; border-radius: 16px; padding: 0 16px; border: 1px solid var(--accent); background: var(--bar); color: var(--accent); font: 700 15px system-ui, sans-serif; cursor: pointer; }
    .download:disabled, .share:disabled { opacity: .5; }
    .note { text-align: center; color: var(--muted); font-size: 12px; margin: 0 0 6px; }
    .state { max-width: 520px; margin: 24px auto; background: var(--bar); border: 1px solid var(--line); border-radius: 16px; padding: 28px 20px; text-align: center; }
    .state h1 { font-size: 19px; margin: 0 0 6px; }
    .spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 12px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="top">
    <div class="title"><b>Ripoti ya matokeo</b><span id="sub">Inafungua…</span></div>
    <div class="zoom" aria-label="Kukuza">
      <button id="zoomOut" type="button" aria-label="Punguza">−</button>
      <span id="zoomText">100%</span>
      <button id="zoomIn" type="button" aria-label="Kuza">+</button>
    </div>
  </header>
  <div id="loading" class="state"><div class="spinner"></div><h1>Inafungua ripoti…</h1></div>
  <div id="error" class="state" hidden><h1 id="errTitle">Ripoti haipatikani</h1><p id="errText" style="color:var(--muted)"></p></div>
  <div class="viewer" id="viewer"><div class="pages" id="pages"></div><p class="note" id="note" hidden></p></div>
  <div class="dock">
    <button class="download" id="pdfBtn" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Pakua PDF
    </button>
    <button class="share" id="shareBtn" type="button" disabled>Shiriki</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="report.js"></script>
</body>
</html>
