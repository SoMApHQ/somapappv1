<!DOCTYPE html>
<html lang="en">
<head>
  <title>SoMAp — Preform One Class Attendance Marking</title>
  <!-- Same scripts as dashboard -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.0/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="prefonecommon.js"></script>
  <style>
    body { background: linear-gradient(to right, #667eea, #764ba2); }
    .table th, .table td { padding: 1rem; }
    .status-select { background: white; color: black; border-radius: 0.25rem; padding: 0.25rem; }
    .mark-all-btn { transition: background 0.3s; }
    .mark-all-btn:hover { background: #16a34a; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-400 to-purple-600 text-white p-4">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold mb-6"><i class="fas fa-users"></i> Preform One Class Attendance Marking</h1>
    <a href="prefoneattendance.html" class="bg-gray-500 p-2 rounded mb-4 inline-block"><i class="fas fa-arrow-left"></i> Back to Attendance Dashboard</a>
    
    <!-- Date Select -->
    <div class="flex flex-wrap items-center gap-3 mb-4">
      <input type="date" id="attDate" class="p-2 rounded bg-white/20 text-white" onchange="loadClassAtt()">
      <span id="attSavedBadge" class="px-3 py-1 rounded-full text-sm font-semibold bg-white/20">—</span>
    </div>
    
    <table class="w-full bg-white/10 rounded table">
      <thead class="bg-white/20">
        <tr>
          <th>#</th>
          <th>ADM</th>
          <th>Name</th>
          <th>Fee Bal</th>
          <th>AM Status</th>
          <th>PM Status</th>
          <th>Notes</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="classAttBody"></tbody>
    </table>
    
    <div class="flex gap-4 mt-4">
      <button onclick="markAllPresent()" class="bg-green-500 p-2 rounded mark-all-btn">Mark All Present</button>
      <button onclick="saveClassAtt()" class="bg-blue-500 p-2 rounded">Save Changes</button>
      <button onclick="exportClassPDF()" class="bg-purple-500 p-2 rounded">Export PDF</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBhONntRE_aRsU0y1YcPZzWud3CBfwH_a8",
      authDomain: "somaptestt.firebaseapp.com",
      databaseURL: "https://somaptestt-default-rtdb.firebaseio.com",
      projectId: "somaptestt",
      storageBucket: "somaptestt.appspot.com",
      messagingSenderId: "105526245138",
      appId: "1:105526245138:web:b8e7c0cb82a46e861965cb",
      measurementId: "G-4HKX7KN6Q3"
    };

    // Initialize Firebase (compat)
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let classData = [];

    // Ensure currentYear is available (from prefonecommon.js)
    if (typeof currentYear === 'undefined') {
      currentYear = new Date().getFullYear(); // Fallback to current year
    }

    // Attendance codes are stored as one letter (P, A, S, L, E, M, T, G). Older
    // saves stored the option text ("P (Present)"), so reads keep only the letter.
    const ATT_CODES = ['P', 'A', 'S', 'L', 'E', 'M', 'T', 'G'];
    const attCode = (v) => {
      const c = String(v || '').trim().charAt(0).toUpperCase();
      return ATT_CODES.includes(c) ? c : 'P';
    };
    // Present = attended both sessions (on time or late).
    const isPresent = (am, pm) => ['P', 'L'].includes(am) && ['P', 'L'].includes(pm);
    // Today in East Africa time (toISOString is UTC and is "yesterday" before 03:00).
    function localToday() {
      const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Nairobi', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).split('/');
      return `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
    function markedBy() {
      try {
        const s = JSON.parse(sessionStorage.getItem('somap.secretarySession') || 'null');
        if (s && s.workerId) return { workerId: s.workerId, name: s.name || '', role: 'secretary' };
      } catch (_) { /* ignore */ }
      const workerId = localStorage.getItem('workerId') || '';
      return { workerId, name: '', role: workerId ? 'worker' : 'staff' };
    }

    // Set default date to today
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('attDate').value = localToday();
      loadClassAtt();
    });

    function loadClassAtt() {
      const date = document.getElementById('attDate').value;
      if (!date) return;
      db.ref(`/schools/Socrates School Preform one/${currentYear}/students`).once('value').then(snap => {
        const studentsObj = snap.val() || {};
        const students = Object.entries(studentsObj);
        let savedCount = 0;
        classData = students.map(([adm, s], idx) => {
          const attRecords = Object.values(s.attendance || {});
          const stored = attRecords.find(a => a && a.date === date);
          if (stored) savedCount++;
          const am = attCode(stored?.am);
          const pm = attCode(stored?.pm);
          const att = { am, pm, notes: stored?.notes || '', present: isPresent(am, pm), saved: Boolean(stored) };
          const paymentsArray = Object.values(s.payments || {});
          const bal = Number(s.totalFee || 0) - paymentsArray.reduce((sum, p) => sum + Number(p.amount || 0), 0);
          return { idx: idx + 1, adm, name: `${s.firstName || ''} ${s.lastName || ''}`.trim(), bal, ...att };
        });
        const badge = document.getElementById('attSavedBadge');
        if (badge) {
          const all = classData.length && savedCount >= classData.length;
          badge.textContent = savedCount
            ? (all ? `✓ Imehifadhiwa (${savedCount}/${classData.length})` : `⚠ Imehifadhiwa kwa ${savedCount}/${classData.length}`)
            : '✗ Bado haijahifadhiwa — bonyeza Save Changes';
          badge.className = `px-3 py-1 rounded-full text-sm font-semibold ${all ? 'bg-green-500' : savedCount ? 'bg-yellow-500 text-black' : 'bg-red-500'}`;
        }
        renderClassTable();
      }).catch(err => {
        console.error('Load error:', err);
        Swal.fire('Error', 'Failed to load students: ' + err.message, 'error');
      });
    }

    function renderClassTable() {
      const tbody = document.getElementById('classAttBody');
      if (classData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center p-4 opacity-75">No students found. Register some in Admissions first.</td></tr>';
        return;
      }
      tbody.innerHTML = classData.map(row => `
        <tr>
          <td>${row.idx}</td>
          <td>${row.adm}</td>
          <td>${row.name}</td>
          <td ${row.bal > 0 ? 'class="text-yellow-300"' : ''}>TSh ${row.bal.toLocaleString()}</td>
          <td>
            <select class="status-select" onchange="updateStatus('${row.adm}', 'am', this.value)">
              <option value="P" ${row.am === 'P' ? 'selected' : ''}>P (Present)</option>
              <option value="A" ${row.am === 'A' ? 'selected' : ''}>A (Absent)</option>
              <option value="S" ${row.am === 'S' ? 'selected' : ''}>S (Sick)</option>
              <option value="L" ${row.am === 'L' ? 'selected' : ''}>L (Late)</option>
              <option value="E" ${row.am === 'E' ? 'selected' : ''}>E (Excused)</option>
              <option value="M" ${row.am === 'M' ? 'selected' : ''}>M (Medical)</option>
              <option value="T" ${row.am === 'T' ? 'selected' : ''}>T (Travel)</option>
              <option value="G" ${row.am === 'G' ? 'selected' : ''}>G (Guardian)</option>
            </select>
          </td>
          <td>
            <select class="status-select" onchange="updateStatus('${row.adm}', 'pm', this.value)">
              <option value="P" ${row.pm === 'P' ? 'selected' : ''}>P (Present)</option>
              <option value="A" ${row.pm === 'A' ? 'selected' : ''}>A (Absent)</option>
              <option value="S" ${row.pm === 'S' ? 'selected' : ''}>S (Sick)</option>
              <option value="L" ${row.pm === 'L' ? 'selected' : ''}>L (Late)</option>
              <option value="E" ${row.pm === 'E' ? 'selected' : ''}>E (Excused)</option>
              <option value="M" ${row.pm === 'M' ? 'selected' : ''}>M (Medical)</option>
              <option value="T" ${row.pm === 'T' ? 'selected' : ''}>T (Travel)</option>
              <option value="G" ${row.pm === 'G' ? 'selected' : ''}>G (Guardian)</option>
            </select>
          </td>
          <td><input type="text" class="p-1 rounded bg-white text-black" value="${row.notes || ''}" onchange="updateNotes('${row.adm}', this.value)"></td>
          <td><button class="bg-red-500 p-1 rounded text-xs text-white" onclick="clearAtt('${row.adm}')"><i class="fas fa-trash"></i></button></td>
        </tr>
      `).join('');
    }

    function updateStatus(adm, period, value) {
      const row = classData.find(r => r.adm === adm);
      if (row) {
        row[period] = attCode(value);
        row.present = isPresent(row.am, row.pm);
        // Optionally check for shifted status
      }
    }

    function updateNotes(adm, notes) {
      const row = classData.find(r => r.adm === adm);
      if (row) row.notes = notes;
    }

    function markAllPresent() {
      classData.forEach(row => {
        row.am = 'P';
        row.pm = 'P';
        row.present = true;
      });
      renderClassTable();
      Swal.fire('Marked!', 'All students marked present.', 'success');
    }

    async function saveClassAtt() {
      const date = document.getElementById('attDate').value;
      if (!date) return Swal.fire('Error', 'Select a date first.', 'error');
      if (!classData.length) return Swal.fire('Error', 'No students to save.', 'error');
      const by = markedBy();
      const base = `/schools/Socrates School Preform one/${currentYear}`;
      try {
        await Promise.all(classData.map(async (row) => {
          const attPath = `${base}/students/${row.adm}/attendance`;
          // Replace this date's record for the learner.
          const snap = await db.ref(attPath).orderByChild('date').equalTo(date).once('value');
          const removals = [];
          snap.forEach(child => { removals.push(child.ref.remove()); });
          await Promise.all(removals);
          await db.ref(attPath).push({
            date, am: row.am, pm: row.pm, present: isPresent(row.am, row.pm), notes: row.notes || '',
            markedAt: Date.now(), markedByWorkerId: by.workerId || '', markedByName: by.name || '',
          });
        }));
        // Day summary: read by the Secretary Desk check-out gate and work reports.
        const present = classData.filter(r => isPresent(r.am, r.pm)).length;
        await db.ref(`${base}/attendanceDays/${date}`).set({
          date, total: classData.length, present, absent: classData.length - present,
          savedAt: Date.now(), savedByWorkerId: by.workerId || '', savedByName: by.name || '', savedByRole: by.role,
        });
        Swal.fire('Saved!', `Attendance saved for ${classData.length} learners (${present} present, ${classData.length - present} absent).`, 'success');
        loadClassAtt();
      } catch (err) {
        console.error('Save error:', err);
        Swal.fire('Error', 'Some attendance could not be saved: ' + err.message, 'error');
      }
    }

    function clearAtt(adm) {
      const date = document.getElementById('attDate').value;
      if (!date) return;
      db.ref(`/schools/Socrates School Preform one/${currentYear}/students/${adm}/attendance`).orderByChild('date').equalTo(date).once('value', snap => {
        snap.forEach(child => child.ref.remove());
      }).then(() => {
        loadClassAtt();
        Swal.fire('Cleared!', 'Attendance for this student on selected date cleared.', 'success');
      }).catch(err => {
        console.error('Clear error:', err);
        Swal.fire('Error', 'Failed to clear attendance.', 'error');
      });
    }

    function exportClassPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape');
      doc.autoTable({
        head: [['#', 'ADM', 'Name', 'Fee Bal', 'AM', 'PM', 'Notes']],
        body: classData.map(row => [row.idx, row.adm, row.name, `TSh ${row.bal.toLocaleString()}`, row.am, row.pm, row.notes || ''])
      });
      doc.save(`class_attendance_${document.getElementById('attDate').value}.pdf`);
    }

  </script>
</body>
</html>
